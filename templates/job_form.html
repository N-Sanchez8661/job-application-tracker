
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">
    <title>Job Form - Job Tracker</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    {% include "_nav.html" %}
    <main class="container">
        <a href="{{ url_for('jobs') }}">← Jobs</a>

        <h1>{{ 'Edit Job' if editing else 'Add Job' }}</h1>

        {% for message in get_flashed_messages() %}
            <p class="message">{{ message }}</p>
        {% endfor %}

        {% if not companies %}
            <p class="message">
                Please add a company before adding a job.
                <a href="{{ url_for('add_company') }}">Add Company</a>
            </p>
        {% endif %}

        <form method="POST" class="company-form">

            <label for="company_id">Company *</label>
            <select id="company_id" name="company_id" required>
                <option value="">Select a company</option>
                {% for company in companies %}
                <option value="{{ company.company_id }}"
                    {% if job.get('company_id')|string == company.company_id|string %}
                        selected
                    {% endif %}>
                    {{ company.company_name }}
                </option>
                {% endfor %}
            </select>

            <label for="job_title">Job Title *</label>
            <input id="job_title" type="text"
                   name="job_title" maxlength="100"
                   value="{{ job.get('job_title') or '' }}"
                   required>

            <label for="job_type">Job Type</label>
            <select id="job_type" name="job_type">
                <option value="">Select job type</option>
                {% for type in ['Full-time', 'Part-time',
                                'Contract', 'Internship'] %}
                    <option value="{{ type }}"
                        {% if job.get('job_type') == type %}
                            selected
                        {% endif %}>
                        {{ type }}
                    </option>
                {% endfor %}
            </select>

            <label for="salary_min">Minimum Salary ($)</label>
            <input id="salary_min" type="number"
                   name="salary_min" min="0"
                   value="{{ job.get('salary_min') if job.get('salary_min') is not none else '' }}">

            <label for="salary_max">Maximum Salary ($)</label>
            <input id="salary_max" type="number"
                   name="salary_max" min="0"
                   value="{{ job.get('salary_max') if job.get('salary_max') is not none else '' }}">

            <label for="job_url">Job Posting URL</label>
            <input id="job_url" type="url"
                   name="job_url" maxlength="300"
                   value="{{ job.get('job_url') or '' }}">

            <label for="date_posted">Date Posted</label>
            <input id="date_posted" type="date"
                   name="date_posted"
                   value="{{ job.get('date_posted') or '' }}">

            <label for="requirements">Required Skills</label>
            <textarea id="requirements" name="requirements"
                      rows="3"
                      placeholder="Python, SQL, Flask">{{ job.get('requirements') or '' }}</textarea>

            <small>Separate each skill with a comma.</small>

            <button type="submit" class="btn"
                    {% if not companies %}disabled{% endif %}>
                {{ 'Save Changes' if editing else 'Add Job' }}
            </button>
        </form>
    </main>
</body>
</html>
