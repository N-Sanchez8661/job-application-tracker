
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Tracker</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <main class="container">
        <h1>Job Application Tracker</h1>
        <p>Welcome to your personal job search dashboard!</p>

        <div class="stats">
            <div class="card">
                <h2>Companies</h2>
                <a href="{{ url_for('companies') }}">View Companies</a>
                <p>{{ company_count }}</p>
            </div>
            <div class="card">
                <h2>Jobs</h2>
                <a href="{{ url_for('jobs') }}">View Jobs</a>
                <p>{{ job_count }}</p>
            </div>
            <div class="card">
                <h2>Applications</h2>
                <a href="{{ url_for('applications') }}">View Applications</a>
                <p>{{ application_count }}</p>
            </div>
            <div class="card">
                <h2>Contacts</h2>
                <a href="{{ url_for('contacts') }}">View Contacts</a>
                <p>{{ contact_count }}</p>
            </div>
        </div>
        <div style="margin-top: 30px;">
    <a href="{{ url_for('job_match') }}" class="btn">
        Find My Job Matches
    </a>
</div>
    </main>
</body>
</html>
